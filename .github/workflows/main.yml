name: Yamay Hub POS Android Build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Android app
        run: |
          cordova create pos com.yamayhub.pos "Yamay Hub POS"
          cp index.html pos/www/index.html
          cd pos
          cordova platform add android
          cordova build android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Yamay-Hub-POS-APK
          path: pos/platforms/android/app/build/outputs/apk/debug/app-debug.apk
